name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  test:
    # Nepal-time results must not depend on the server's time zone, so run the suite in a zone
    # behind UTC, at UTC and in Nepal itself. Every test asserts fixed values, so all three
    # passing means all three give the same results.
    name: Test (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, America/New_York, Asia/Kathmandu]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  node:
    # package.json "engines" says Node 18 and later. The dev tools need a newer Node, so build
    # with Node 24, then run the built package on each supported version, as ESM and CommonJS.
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run smoke
