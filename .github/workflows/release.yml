name: Release

# On every push to main, Changesets does one of two things:
# - If there are changesets, it opens or updates a "Version Packages" pull request that bumps
#   the version and writes the changelog entry.
# - If there are none and package.json has a version that isn't on npm yet, which is what merging
#   that pull request leaves, it tests, packs and publishes it with provenance, then tags the
#   commit and creates a GitHub release from the changelog entry.
# Publishing uses npm trusted publishing, so there's no npm token: npm checks that the package
# comes from this workflow in this repository. CONTRIBUTING.md explains the one-time setup.
on:
  push:
    branches: [main]

# Each job gets only the permissions it needs, and only the publish job can publish.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    name: Check for changesets
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Open the release pull request
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - uses: changesets/action/version@v2
        with:
          script: npm run version-packages
          commit-message: "chore: release"
          pr-title: Release

  pack:
    name: Test and pack
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      # The CI workflow runs on the same push, but publishing doesn't wait for it, so check the
      # exact commit being released here too.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write # to tag the release and create the GitHub release
      id-token: write # for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
        env:
          # The same as npm publish --provenance: npm links the package on npmjs.com to the
          # commit and workflow run that built it.
          NPM_CONFIG_PROVENANCE: true
